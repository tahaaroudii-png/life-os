name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE: /life-os/
      VITE_SUPABASE_URL: https://zeaqumxcpjvyavzrydmm.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_OMSI56Gc78L_sfTdA0KWSw__aWo-JSU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # C'est l'app que Tahar utilise au quotidien : elle occupe la racine.
      - working-directory: legacy
        run: npm install --no-audit --no-fund
      - working-directory: legacy
        run: npm run build
      # Pages ne gère pas les redirections : une route rechargée tombe sur
      # 404, que l'on sert avec l'app elle-même.
      - run: cp legacy/dist/index.html legacy/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
